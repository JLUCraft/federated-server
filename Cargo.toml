[package]
name = "game-server"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
flate2 = "1"
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["serde"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde_json = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
subtle = "2"
union-core = { path = "../union-core", features = ["consensus"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
terminal-runtime = { path = "../union-core/crates/terminal-runtime" }
minecraftd = { path = "../minecraftd" }

[lints.rust]
unsafe_code = "forbid"

[workspace]

[dev-dependencies]
tempfile = "3"
