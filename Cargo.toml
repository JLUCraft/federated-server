[package]
name = "federated-server"
version = "0.2.0"
edition = "2024"
authors = ["JLUCraft"]
description = "Federated Minecraft service host: league authority, native protocol proxy and Paper scoring bridge"
license = "GPL-3.0-only"
repository = "https://github.com/JLUCraft/game-server"
publish = false

[dependencies]
base64 = "0.22"
aes-gcm = "0.11"
state = { path = "../union-core/crates/state" }
client = { path = "../union-core/crates/client", features = ["office", "documents"] }
events = { path = "../union-core/crates/events", features = ["documents"] }
flows = { path = "../union-core/crates/flows" }
llm-gateway = { path = "../union-core/crates/llm-gateway" }
flate2 = "1"
hmac = "0.13"
sha2 = "0.11"
uuid = { version = "1", features = ["serde"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde_json = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
subtle = "2"
league = { path = "../union-core/crates/league", features = ["runtime"] }
authority = { path = "../union-core/crates/authority" }
node = { path = "../union-core/crates/node" }
identity = { path = "../union-core/crates/identity" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
terminal-runtime = { path = "../union-core/crates/terminal-runtime" }
minecraftd = { path = "../minecraftd" }
web-push = { version = "0.11", default-features = false }
reqwest = { version = "0.13", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[workspace]
resolver = "2"
members = []
default-members = ["."]

[dev-dependencies]
tempfile = "3"

[features]
default = ["server"]
server = ["league/consensus"]

[[bin]]
name = "federated-server"
path = "src/main.rs"
required-features = ["server"]
